<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>まつりちゃんの駐車場</title>
<style>
body { margin:0; font-family:sans-serif; background:#f0f2f5; }
.header { background:#4CAF50; color:white; padding:15px; font-size:20px; text-align:center; }
.stats { display:flex; justify-content:space-around; padding:10px; background:white; flex-wrap:wrap;}
.stat { text-align:center; margin:2px 0; }
#level, #nextUnlock { text-align:center; margin:5px; }
#adNotice { text-align:center; color:#ff5722; font-weight:bold; }
#parksContainer { display:flex; flex-wrap:wrap; justify-content:center; }
.parkBox { background:white; border-radius:10px; margin:5px; padding:5px; width:240px; }
.parkTitle { text-align:center; font-weight:bold; margin-bottom:3px; }
.slot { background:#ddd; aspect-ratio:1; border-radius:8px; position:relative; overflow:hidden; margin-bottom:2px; }
.car { position:absolute; width:80%; height:80%; border-radius:6px; top:10%; left:10%; transition:top 1s ease, left 1s ease; }
.controls { display:flex; flex-wrap:wrap; justify-content:center; padding:5px; margin-bottom:10px; }
button { flex:1; margin:1px; padding:5px; font-size:14px; border:none; border-radius:8px; min-width:50px; }
#carInfo { background:white; margin:5px; padding:5px; border-radius:8px; }
</style>
</head>
<body>

<div class="header" onclick="adminTap()">まつりちゃんの駐車場</div>

<div class="stats">
  <div class="stat">💰所持金<br><span id="money">0</span></div>
  <div class="stat">💰総収入<br><span id="totalEarned">0</span></div>
  <div class="stat">🅿️駐車場数<br><span id="parkCount">0</span></div>
</div>

<div id="level">レベル: <span id="levelNum">1</span></div>
<div id="nextUnlock"></div>
  <div id="dateInfo" style="text-align:center;font-weight:bold;margin:5px;"></div>
<div id="economyInfo" style="text-align:center;color:#2196F3;"></div>
<div id="eventInfo" style="text-align:center;color:#E91E63;"></div>
<div id="adNotice"></div>

<div id="parksContainer"></div>

<div id="carInfo">
  <strong>🚘 車の種類と収益倍率:</strong><br>
  普通: 1x (青), 高級: 3x (黄), スポーツ: 5x (オレンジ), VIP: 10x (紫)
</div>

<script>
// ====== データ ======
let money = 1000;
let adBoost = 0;
let totalEarned = 0;
let level = 1;
// ====== 日付システム ======
let gameDate = {
  year: 2026,
  month: 1,
  day: 1
};

let economy = {
  name: "普通",
  bonus: 1.0
};


function changeEconomy(){
  const r = Math.random();

  if(r < 0.2){
    economy = { name:"不景気", bonus:0.7 };
  }else if(r < 0.8){
    economy = { name:"普通", bonus:1.0 };
  }else{
    economy = { name:"好景気", bonus:1.5 };
  }

  document.getElementById("economyInfo").textContent =
    "景気：" + economy.name;
}

let economyLuck = 0; // 景気運レベル
let currentEvent = "なし";
let parks = [
  { name:"郊外", slots:5, price:80, cars:[], demandBase:0.6, unlocked:true, unlockAt:0, expandCost:500, priceUpCost:20, priceDownCost:20, adCost:500 },
  { name:"駅前", slots:5, price:120, cars:[], demandBase:1.0, unlocked:false, unlockAt:5000, expandCost:1000, priceUpCost:40, priceDownCost:30, adCost:1000 },
  { name:"商業街", slots:6, price:100, cars:[], demandBase:0.8, unlocked:false, unlockAt:10000, expandCost:1200, priceUpCost:50, priceDownCost:40, adCost:1200 },
  { name:"住宅街", slots:4, price:70, cars:[], demandBase:0.5, unlocked:false, unlockAt:15000, expandCost:800, priceUpCost:15, priceDownCost:10, adCost:800 },
  { name:"空港前", slots:6, price:150, cars:[], demandBase:1.2, unlocked:false, unlockAt:20000, expandCost:2000, priceUpCost:60, priceDownCost:50, adCost:2000 },
  { name:"高級住宅街", slots:5, price:180, cars:[], demandBase:1.0, unlocked:false, unlockAt:35000, expandCost:2500, priceUpCost:80, priceDownCost:70, adCost:2500 },
  { name:"高速道路前", slots:6, price:90, cars:[], demandBase:0.8, unlocked:false, unlockAt:40000, expandCost:1800, priceUpCost:50, priceDownCost:40, adCost:1800 },
  { name:"三郷", slots:5, price:800, cars:[], demandBase:0.6, unlocked:false, unlockAt:100000, expandCost:5000, priceUpCost:20, priceDownCost:20, adCost:500 },
  { name:"東京", slots:5, price:1200, cars:[], demandBase:1.0, unlocked:false, unlockAt:500000, expandCost:10000, priceUpCost:40, priceDownCost:30, adCost:1000 },
  { name:"横浜", slots:6, price:1000, cars:[], demandBase:0.8, unlocked:false, unlockAt:1000000, expandCost:12000, priceUpCost:50, priceDownCost:40, adCost:1200 },
  { name:"浜松", slots:4, price:7000, cars:[], demandBase:0.5, unlocked:false, unlockAt:15000000, expandCost:8000, priceUpCost:15, priceDownCost:10, adCost:800 },
  { name:"名古屋", slots:6, price:15000, cars:[], demandBase:1.2, unlocked:false, unlockAt:200000000, expandCost:20000, priceUpCost:60, priceDownCost:50, adCost:2000 },
  { name:"京都", slots:5, price:180000, cars:[], demandBase:1.0, unlocked:false, unlockAt:350000000, expandCost:25000, priceUpCost:80, priceDownCost:70, adCost:2500 },
  { name:"大阪", slots:5, price:80000, cars:[], demandBase:0.6, unlocked:false, unlockAt:100000000, expandCost:5000, priceUpCost:20, priceDownCost:20, adCost:500 },
  { name:"神戸", slots:5, price:120000, cars:[], demandBase:1.0, unlocked:false, unlockAt:500000000, expandCost:10000, priceUpCost:40, priceDownCost:30, adCost:1000 },
  { name:"倉敷", slots:6, price:100000, cars:[], demandBase:0.8, unlocked:false, unlockAt:1000000000, expandCost:12000, priceUpCost:50, priceDownCost:40, adCost:1200 },
  { name:"広島", slots:4, price:700000, cars:[], demandBase:0.5, unlocked:false, unlockAt:150000000000, expandCost:8000, priceUpCost:15, priceDownCost:10, adCost:800 },
  { name:"山口", slots:4, price:4000000, cars:[], demandBase:0.5, unlocked:false, unlockAt:150000000000, expandCost:8000, priceUpCost:15, priceDownCost:10, adCost:800 },
  { name:"福岡（門司）", slots:6, price:90000000, cars:[], demandBase:0.8, unlocked:false, unlockAt:400000000000000, expandCost:18000, priceUpCost:50, priceDownCost:40, adCost:1800 }
];

// 実績
let achievements = [
  { id:"money1", text:"1万円達成", done:false, check:()=> totalEarned>=10000 },
  { id:"vip1", text:"VIP車入庫", done:false, check:()=> parks.some(p=>p.cars.some(c=>c.type==="VIP")) },
  { id:"slots20", text:"合計スロット20台", done:false, check:()=> parks.reduce((a,b)=>a+b.slots,0)>=20 }
];

// ====== 車生成 ======
function createCar(){
  const types = [
    { type:"普通", rate:1, color:"#2196F3", stay:Math.random()*10+5 },
    { type:"高級", rate:3, color:"#FFD700", stay:Math.random()*15+5 },
    { type:"スポーツ", rate:5, color:"#FF5722", stay:Math.random()*20+5 },
    { type:"VIP", rate:10, color:"#9C27B0", stay:Math.random()*25+10 }
  ];
  let r=Math.random();
  if(r<0.03) return types[3];
  else if(r<0.1) return types[2];
  else if(r<0.2) return types[1];
  else return types[0];
}

// ====== 需要計算 ======
function getDemand(park){
  let d = park.demandBase - (park.price/400);
  d += adBoost;
  d += (Math.random()-0.5)*0.2;
  d *= 1+(level-1)*0.1;
  return Math.max(0.05, Math.min(1,d));
}

// ====== 更新 ======
function update(){
  document.getElementById("money").textContent=Math.floor(money);
  document.getElementById("totalEarned").textContent=Math.floor(totalEarned);
  document.getElementById("levelNum").textContent=level;
  document.getElementById("adNotice").textContent=adBoost>0?"📢 広告中!":"";
  document.getElementById("parkCount").textContent=parks.filter(p=>p.unlocked).length;

  const nextPark = parks.find(p=>!p.unlocked);
  document.getElementById("nextUnlock").textContent = nextPark ?
    `次の駐車場「${nextPark.name}」は総収入 ${nextPark.unlockAt}円でアンロック` : "";

  renderParks();
  checkAchievements();
}

// ====== 駐車場描画 ======
function renderParks(){
  const container=document.getElementById("parksContainer");
  container.innerHTML="";
  parks.forEach((park)=>{
    if(!park.unlocked) return;
    const box=document.createElement("div");
    box.className="parkBox";
    const title=document.createElement("div");
    title.className="parkTitle";
    title.textContent=`${park.name} (¥${park.price})`;
    box.appendChild(title);

    // 駐車場スロット
    const grid=document.createElement("div");
    grid.style.display="grid";
    grid.style.gridTemplateColumns="repeat(5,1fr)";
    grid.style.gap="5px";
    for(let j=0;j<park.slots;j++){
      const slot=document.createElement("div");
      slot.className="slot";
      if(park.cars[j]){
        const car=document.createElement("div");
        car.className="car";
        car.style.background=park.cars[j].color;
        slot.appendChild(car);
      }
      grid.appendChild(slot);
    }
    box.appendChild(grid);

    // 個別アップグレードボタン
    const controls=document.createElement("div");
    controls.className="controls";

    const expandBtn=document.createElement("button");
    expandBtn.textContent=`拡張 ${park.expandCost}円`;
    expandBtn.onclick=()=>{
      if(money>=park.expandCost){
        money-=park.expandCost;
        park.slots++;
        park.expandCost=Math.floor(park.expandCost*1.5);
        update(); save(); unlockParks();
      }
    };

    const priceUpBtn=document.createElement("button");
    priceUpBtn.textContent=`値上げ ${park.priceUpCost}円`;
    priceUpBtn.onclick=()=>{
      if(money>=park.priceUpCost){
        money-=park.priceUpCost;
        park.price+=20;
        park.priceUpCost=Math.floor(park.priceUpCost*1.3);
        update(); save();
      }
    };

    const priceDownBtn=document.createElement("button");
    priceDownBtn.textContent=`値下げ ${park.priceDownCost}円`;
    priceDownBtn.onclick=()=>{
      if(money>=park.priceDownCost){
        money-=park.priceDownCost;
        park.price=Math.max(20,park.price-20);
        park.priceDownCost=Math.floor(park.priceDownCost*1.2);
        update(); save();
      }
    };

    const adBtn=document.createElement("button");
    adBtn.textContent=`広告 ${park.adCost}円`;
    adBtn.onclick=()=>{
      if(money>=park.adCost){
        money-=park.adCost;
        adBoost=0.5;
        park.adCost=Math.floor(park.adCost*1.4);
        update(); save();
      }
    };

    controls.appendChild(expandBtn);
    controls.appendChild(priceUpBtn);
    controls.appendChild(priceDownBtn);
    controls.appendChild(adBtn);
    box.appendChild(controls);
    container.appendChild(box);
  });
}

// ====== 駐車場アンロック ======
function unlockParks(){
  parks.forEach(p=>{
    if(totalEarned >= p.unlockAt){
      p.unlocked = true;
    }
  });
}

// ====== 実績 ======
function checkAchievements(){
  achievements.forEach(a=>{
    if(!a.done && a.check()){ a.done=true; alert("🎉 実績解除: "+a.text); }
  });
}

// ====== レベルアップ ======
function checkLevel(){
  const newLevel=Math.floor(totalEarned/20000)+1;
  if(newLevel>level){
    level=newLevel;
    alert(`⚡ レベルアップ! レベル${level}`);
  }
}

// ====== メインループ ======
setInterval(()=>{
 
  // 時間経過（30秒で1日）
gameDate.day++;

if(gameDate.day > 30){
  gameDate.day = 1;
  gameDate.month++;

  changeEconomy();
}

if(gameDate.month > 12){
  gameDate.month = 1;
  gameDate.year++;
}

document.getElementById("dateInfo").textContent =
`${gameDate.year}年 ${gameDate.month}月 ${gameDate.day}日`;
  parks.forEach((park)=>{
    if(!park.unlocked) return;
    if(park.cars.length<park.slots && Math.random()<getDemand(park)){
      park.cars.push(createCar());
    }
    park.cars.forEach(c=>c.stay--);
    const leaving=park.cars.filter(c=>c.stay<=0);
    park.cars=park.cars.filter(c=>c.stay>0);
    leaving.forEach(c=>{
      const earning = Math.floor(park.price * c.rate * economy.bonus);
      money+=earning;
      totalEarned+=earning;
    });
  });
  adBoost*=0.9;
  checkLevel();
  unlockParks();
  update();
},1000);

// ====== セーブ/ロード（放置報酬統合版） ======
function save(){
  const data = {
  money,
  adBoost,
  parks,
  totalEarned,
  level,
  gameDate,
  economy,
  economyLuck,
  currentEvent,
  achievements,
  time: Date.now()
};

localStorage.setItem("parkingGame7", JSON.stringify(data));
}

function load(){
  const raw = localStorage.getItem("parkingGame7");
  if(!raw) return;
  const data = JSON.parse(raw);

  money = data.money ?? 1000;
  adBoost = data.adBoost ?? 0;
  parks = data.parks ?? parks;
  totalEarned = data.totalEarned ?? 0;
  level = data.level ?? 1;
  gameDate = data.gameDate ?? gameDate;
economy = data.economy ?? economy;
economyLuck = data.economyLuck ?? 0;
currentEvent = data.currentEvent ?? "なし";
achievements = data.achievements ?? achievements;

  // 放置報酬計算
  if(data.time){
    const secondsRaw = (Date.now() - data.time) / 1000;
    const seconds = isFinite(secondsRaw) ? Math.min(secondsRaw, 3600*4) : 0;

    let potential = 0;
    parks.forEach(park=>{
      if(!park.unlocked) return;
      // 車ごとの報酬計算（rate * price * 需要 * 秒数簡易換算）
      park.cars.forEach(car=>{
        const demand = getDemand(park);
        if(isFinite(car.rate) && isFinite(park.price) && isFinite(demand)){
          potential += Math.floor(car.rate * park.price * demand * (seconds / 10));
        }
      });
      // 空きスロット分も簡易報酬
      const emptySlots = park.slots - park.cars.length;
      if(emptySlots > 0){
        potential += Math.floor(emptySlots * park.price * 0.1 * seconds / 10);
      }
    });

    if(!isFinite(potential)) potential = 0;
    money += potential;
    totalEarned += potential;
    if(potential > 0) alert(`💰 放置報酬: ${potential}円`);
  }
}

setInterval(save,5000);
window.addEventListener("beforeunload", save);
load();
update();

// ===== 管理者パネル =====

let adminTapCount = 0;

function adminTap(){
  adminTapCount++;

  if(adminTapCount >= 5){
    adminTapCount = 0;
    openAdmin();
  }

  setTimeout(() => {
    adminTapCount = 0;
  }, 2000);
}

function openAdmin(){
  const pass = prompt("管理者パスワード");

  if(pass === "matsuri"){
    document.getElementById("adminPanel").style.display = "block";
  }else{
    alert("パスワードが違います");
  }
}

function adminClose(){
  document.getElementById("adminPanel").style.display = "none";
}

function adminAddMoney(){
  const amount = Number(prompt("追加する金額を入力してください"));

  if(isNaN(amount) || amount <= 0){
    alert("正しい金額を入力してください。");
    return;
  }

  money += amount;
  totalEarned += amount;

  update();
  save();

  alert(amount.toLocaleString() + "円追加しました！");
}

function adminLevelUp(){
  level++;
  update();
  save();
}

function adminUnlockAll(){
  parks.forEach(p => p.unlocked = true);
  update();
  save();
}

function adminAchievement(){
  achievements.forEach(a => a.done = true);
  update();
  save();
}

function adminDeleteSave(){
  if(confirm("本当にセーブデータを削除しますか？")){
    localStorage.removeItem("parkingGame7");
    alert("セーブデータを削除しました。");
    location.reload();
  }
}

</script>
<div id="adminPanel" style="display:none;position:fixed;top:10px;right:10px;background:#fff;border:2px solid #333;padding:10px;border-radius:10px;z-index:9999;">
  <h3>🛠 管理者パネル</h3>

  <button onclick="adminAddMoney()">💰好きな金額を追加</button><br><br>

  <button onclick="adminLevelUp()">⭐レベル+1</button><br><br>

  <button onclick="adminUnlockAll()">🅿️全駐車場解放</button><br><br>

  <button onclick="adminAchievement()">🏆実績全解除</button><br><br>

  <button onclick="adminDeleteSave()">🗑セーブデータ削除</button><br><br>

  <button onclick="adminClose()">閉じる</button>
</div>
</body>
</html>
