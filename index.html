<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>まつりちゃんクリックゲーム</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html { touch-action: manipulation; font-size:16px; }
body {
  text-align: center;
  font-family: Impact, sans-serif;
  background: radial-gradient(circle, #0f2027, #000);
  color: white;
  margin: 0;
  padding: 5px;
}
h1{ font-size:28px; text-shadow:0 0 10px cyan; margin:10px 0;}
button { padding:16px 24px; margin:4px; font-size:18px; border:none; border-radius:10px; background:linear-gradient(45deg, red, orange); color:white; min-width:90px; cursor:pointer;}
button:disabled { cursor: not-allowed; opacity:0.5; }
.effect { position:absolute; animation: float 0.8s forwards; font-weight:bold; }
@keyframes float { to { transform: translateY(-80px); opacity:0;} }
.menu-section { border:2px solid cyan; border-radius:10px; padding:10px; margin:6px 0; background: rgba(0,0,0,0.5);}
.menu-section h2 { margin:0 0 6px 0; cursor:pointer; user-select:none; font-size:18px; }
.menu-content.hidden { display:none; }
#volumeSlider { width:80%; }
@media(max-width:480px){ button{font-size:16px; padding:12px 18px;} }
</style>
</head>
<body>

<h1>まつりちゃんクリックゲーム</h1>

<div class="menu-section">
<h2 onclick="toggleMenu(this)">📊 ステータス</h2>
<div class="menu-content" id="statusMenu">
時間: <span id="time">10</span><br>
スコア: <span id="score">0</span><br>
最高: <span id="high">0</span><br>
パワー: <span id="power">1</span><br>
コンボ: <span id="combo">0</span><br>
自動: <span id="auto">0</span>/秒<br>
転生(RP): <span id="rebirth">0</span><br>
倍率: <span id="multi">1</span><br>
</div>
</div>

<div class="menu-section">
<h2 onclick="toggleMenu(this)">🎮 ゲーム操作</h2>
<div class="menu-content" id="gameMenu">
<button id="clickBtn">クリック</button><br>
<button onclick="start()">スタート</button>
<button onclick="skill()">スキル (10倍)</button>
<button onclick="rebirthAction()">転生</button>
</div>
</div>

<div class="menu-section">
<h2 onclick="toggleMenu(this)">🌳 スキルツリー</h2>
<div class="menu-content" id="skillMenu">
攻撃 <span id="s_click">0/10</span> <button onclick="buySkill('click')">+</button><br>
自動 <span id="s_auto">0/10</span> <button onclick="buySkill('auto')">+</button><br>
クリ率 <span id="s_crit">0/10</span> <button onclick="buySkill('crit')">+</button><br>
ガチャ <span id="s_gacha">0/10</span> <button onclick="buySkill('gacha')">+</button><br>
</div>
</div>

<div id="msg" style="margin:6px;"></div>

<audio id="audioClick" src="https://arspark.jp/material/wp-content/uploads/2023/08/arsnd_00236_buttonon.mp3"></audio>
<audio id="audioCrit" src="https://orangefreesounds.com/wp-content/uploads/2024/01/Critical-hit-sound-effect.mp3"></audio>
<audio id="audioGacha" src="https://arspark.jp/material/wp-content/uploads/2023/08/arsnd_00246_rareitem.mp3"></audio>
<audio id="audioSkill" src="https://arspark.jp/material/wp-content/uploads/2023/04/arsnd_00029_levelups.mp3"></audio>
<audio id="audioLevelUp" src="https://orangefreesounds.com/wp-content/uploads/2024/12/Game-level-up-sound-effect.mp3"></audio>
<audio id="audioRebirth" src="https://arspark.jp/material/wp-content/uploads/2023/04/arsnd_00003_coinmari.mp3"></audio>

<script>
// ユーティリティ
const el=id=>document.getElementById(id);
function toggleMenu(header){ header.nextElementSibling.classList.toggle("hidden"); }

// 基本変数
let score=0,time=10,combo=0;
let power=parseFloat(localStorage.getItem("p"))||1;
let auto=parseFloat(localStorage.getItem("a"))||0;
let high=parseInt(localStorage.getItem("h"))||0;
let multiBonus=parseFloat(localStorage.getItem("multiBonus"))||1;
let skillActive=false;

// 進化版スキルツリー
let skills=JSON.parse(localStorage.getItem("skills"))||{
  click:{lvl:0,max:10,rpBase:1,desc:"クリック攻撃力UP",unlock:()=>true},
  auto:{lvl:0,max:10,rpBase:1,desc:"自動加算UP",unlock:()=>skills.click.lvl>=3},
  crit:{lvl:0,max:10,rpBase:1,desc:"クリ率UP",unlock:()=>true},
  gacha:{lvl:0,max:10,rpBase:1,desc:"ガチャ確率UP",unlock:()=>skills.crit.lvl>=5}
};

let rebirth=parseInt(localStorage.getItem("r"))||0;

// UI更新
function update(){
  el("power").textContent=power.toFixed(2);
  el("combo").textContent=combo;
  el("auto").textContent=auto;
  el("high").textContent=high;
  el("rebirth").textContent=rebirth;
  el("multi").textContent=multiBonus.toFixed(1);
}

// スコアアニメーション
function updateScoreAnimation(){
  let displayed=parseFloat(el("score").textContent)||0;
  let diff=score-displayed;
  if(Math.abs(diff)<1){ el("score").textContent=Math.floor(score); return;}
  el("score").textContent=Math.floor(displayed+diff/5);
  requestAnimationFrame(updateScoreAnimation);
}

// スキルUI更新
function skillCost(type){ return skills[type].rpBase+Math.floor(skills[type].lvl/2);}
function updateSkillsUI(){
  for(const type in skills){
    let elSpan=el("s_"+type);
    let btn=elSpan.nextElementSibling;
    elSpan.textContent=`${skills[type].lvl}/${skills[type].max}`;
    if(!skills[type].unlock()){
      btn.disabled=true; btn.style.opacity=0.3; btn.title="未解放"; continue;
    }
    if(rebirth<skillCost(type)||skills[type].lvl>=skills[type].max){ btn.disabled=true; btn.style.opacity=0.5;}
    else{ btn.disabled=false; btn.style.opacity=1;}
    btn.title=`${skills[type].desc}\n消費RP:${skillCost(type)}`;
  }
  el("rebirth").textContent=rebirth;
}

// スキル購入
function buySkill(type){
  let cost=skillCost(type);
  if(!skills[type].unlock()){ alert("未解放スキル"); return;}
  if(rebirth<cost){ alert("RP不足"); return;}
  if(skills[type].lvl>=skills[type].max){ alert("最大レベル"); return;}
  rebirth-=cost;
  skills[type].lvl++;
  localStorage.setItem("r",rebirth);
  localStorage.setItem("skills",JSON.stringify(skills));
  updateSkillsUI(); update();
}

// クリック
function clickAction(x=200,y=300){
  el("audioClick").currentTime=0; el("audioClick").play();
  let multi=1+Math.log2(combo+1);
  let critChance=0.1+(skills.crit.lvl*0.02);
  let crit=Math.random()<critChance;
  if(crit){ el("audioCrit").currentTime=0; el("audioCrit").play(); document.body.style.transform="translateX(5px)";
    setTimeout(()=>document.body.style.transform="",50);}
  let gain=power*multi*(1+skills.click.lvl*0.2)*multiBonus;
  if(skillActive) gain*=10;
  score+=gain;
  combo+=skills.click.lvl;
  show("+"+gain.toFixed(1),x,y,crit);
  clearTimeout(window.comboReset); window.comboReset=setTimeout(()=>combo=0,1000);
  if(score>high&&score-high>10){ el("audioLevelUp").currentTime=0; el("audioLevelUp").play();}
  updateScoreAnimation();
}

// ゲーム開始
function start(){
  score=0; time=10; combo=0;
  clearInterval(window.t); clearInterval(window.a);
  window.t=setInterval(()=>{
    time--; if(time<=3) document.body.style.background="darkred";
    if(time<=0) end();
    el("time").textContent=time;
  },1000);
  window.a=setInterval(()=>{
    score+=auto*power*(1+skills.auto.lvl*0.5)*multiBonus;
    updateScoreAnimation();
  },1000);
}

// ゲーム終了
function end(){
  clearInterval(window.t); clearInterval(window.a);
  if(score>high){ high=score; localStorage.setItem("h",high);}
  power+=Math.sqrt(score)*0.5;
  localStorage.setItem("p",power); localStorage.setItem("a",auto);
  updateScoreAnimation();
  alert("スコア:"+Math.floor(score));
}

// スキル発動
function skill(){ if(skillActive) return; skillActive=true; el("msg").textContent="🔥10倍中！"; el("audioSkill").play();
  setTimeout(()=>{skillActive=false; el("msg").textContent="";},5000);}

// 転生
function rebirthAction(){ let rp=Math.floor(Math.sqrt(score/1000)); if(rp<=0){ alert("スコア不足"); return;}
if(!confirm("転生して "+rp+" RP獲得?")) return; rebirth+=rp; score=0; power=1; auto=0; combo=0;
localStorage.setItem("r",rebirth); localStorage.setItem("p",power); localStorage.setItem("a",auto); update(); updateSkillsUI();
el("audioRebirth").play();}

// エフェクト
function show(text,x,y,crit){ let e=document.createElement("div"); e.className="effect"; e.textContent=text; e.style.left=x+"px"; e.style.top=y+"px"; e.style.color=crit?"red":"yellow"; document.body.appendChild(e); setTimeout(()=>e.remove(),800);}

// 初期表示
update(); updateScoreAnimation(); updateSkillsUI();

// クリック対応
el("clickBtn").onclick=e=>{ clickAction(e.clientX,e.clientY); updateScoreAnimation(); };
el("clickBtn").addEventListener("touchstart",e=>{ e.preventDefault(); clickAction(e.touches[0].clientX,e.touches[0].clientY); updateScoreAnimation(); });
</script>
</body>
</html>
