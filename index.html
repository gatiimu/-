<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>まつりちゃんの駐車場</title>
<style>
body { margin:0; font-family:sans-serif; background:#f0f2f5; }
.header { background:#4CAF50; color:white; padding:15px; font-size:20px; text-align:center; }
.stats { display:flex; justify-content:space-around; padding:10px; background:white; }
.stat { text-align:center; }
#parksContainer { display:flex; flex-wrap:wrap; justify-content:center; }
.parkBox { background:white; border-radius:10px; margin:5px; padding:5px; width:200px; }
.parkTitle { text-align:center; font-weight:bold; }
#level { text-align:center; margin:5px; }
#adNotice { text-align:center; color:#ff5722; font-weight:bold; }
#parking { display:grid; grid-template-columns: repeat(5,1fr); gap:5px; }
.slot { background:#ddd; aspect-ratio:1; border-radius:8px; position:relative; overflow:hidden; margin-bottom:2px; }
.car { position:absolute; width:80%; height:80%; border-radius:6px; top:10%; left:10%; transition:top 1s ease, left 1s ease; }
.controls { position:fixed; bottom:0; width:100%; display:flex; background:white; padding:5px; box-shadow:0 -2px 5px rgba(0,0,0,0.1);}
button { flex:1; margin:1px; padding:10px; font-size:16px; border:none; border-radius:8px; }
.pop { position:absolute; color:white; font-weight:bold; pointer-events:none; animation:pop 1s ease forwards; }
@keyframes pop { 0% {opacity:1; transform:translateY(0);} 100% {opacity:0; transform:translateY(-50px);} }
</style>
</head>
<body>

<div class="header">まつりちゃんの駐車場</div>

<div class="stats">
  <div class="stat">💰<br><span id="money">0</span></div>
  <div class="stat">🅿️駐車場数<br><span id="parkCount">0</span></div>
</div>

<div id="level">レベル: <span id="levelNum">1</span></div>
<div id="adNotice"></div>

<div id="parksContainer"></div>

<div class="controls">
  <button onclick="expandAll()">拡張</button>
  <button onclick="priceUpAll()">値上げ</button>
  <button onclick="advertiseAll()">広告</button>
</div>

<script>
// ====== データ ======
let money = 1000;
let adBoost = 0;
let totalEarned = 0;
let level = 1;

// 複数駐車場
let parks = [
  { name:"駅前", slots:5, price:120, cars:[], demandBase:1.0 },
  { name:"郊外", slots:8, price:80, cars:[], demandBase:0.6 },
  { name:"商業街", slots:6, price:100, cars:[], demandBase:0.8 }
];

// 実績
let achievements = [
  { id:"money1", text:"1万円達成", done:false, check:()=> totalEarned>=10000 },
  { id:"vip1", text:"VIP車入庫", done:false, check:()=> parks.some(p=>p.cars.some(c=>c.type==="VIP")) },
  { id:"slots20", text:"合計スロット20台", done:false, check:()=> parks.reduce((a,b)=>a+b.slots,0)>=20 }
];

// ====== 車生成 ======
function createCar(){
  const types = [
    { type:"普通", rate:1, color:"#2196F3", stay:Math.random()*10+5 },
    { type:"高級", rate:3, color:"#FFD700", stay:Math.random()*15+5 },
    { type:"スポーツ", rate:5, color:"#FF5722", stay:Math.random()*20+5 },
    { type:"VIP", rate:10, color:"#9C27B0", stay:Math.random()*25+10 }
  ];
  let r = Math.random();
  let t;
  if(r<0.03) t=types[3]; 
  else if(r<0.1) t=types[2]; 
  else if(r<0.2) t=types[1];
  else t=types[0];
  return { type:t.type, rate:t.rate, color:t.color, stay:t.stay };
}

// ====== 需要計算 ======
function getDemand(park){
  let d = park.demandBase - (park.price/400);
  d += adBoost;
  d += (Math.random()-0.5)*0.2;
  d *= 1+(level-1)*0.1;
  return Math.max(0.05, Math.min(1,d));
}

// ====== 更新 ======
function update(){
  document.getElementById("money").textContent=Math.floor(money);
  document.getElementById("levelNum").textContent=level;
  document.getElementById("adNotice").textContent=adBoost>0?"📢 広告中!":"";
  document.getElementById("parkCount").textContent=parks.length;
  renderParks();
  checkAchievements();
}

// ====== 駐車場描画 ======
function renderParks(){
  const container=document.getElementById("parksContainer");
  container.innerHTML="";
  parks.forEach((park,i)=>{
    const box=document.createElement("div");
    box.className="parkBox";
    const title=document.createElement("div");
    title.className="parkTitle";
    title.textContent=`${park.name} (¥${park.price})`;
    box.appendChild(title);

    const grid=document.createElement("div");
    grid.style.display="grid";
    grid.style.gridTemplateColumns="repeat(5,1fr)";
    grid.style.gap="5px";
    for(let j=0;j<park.slots;j++){
      const slot=document.createElement("div");
      slot.className="slot";
      if(park.cars[j]){
        const car=document.createElement("div");
        car.className="car";
        car.style.background=park.cars[j].color;
        slot.appendChild(car);
      }
      grid.appendChild(slot);
    }
    box.appendChild(grid);
    container.appendChild(box);
  });
}

// ====== 拡張/値上げ/広告全体 ======
function expandAll(){
  parks.forEach(p=>{
    if(money>=500){ money-=500; p.slots++; }
  });
  save();
  update();
}
function priceUpAll(){
  parks.forEach(p=>p.price+=20);
  save();
  update();
}
function advertiseAll(){
  if(money>=500){ money-=500; adBoost=0.5; save(); }
}

// ====== 実績 ======
function checkAchievements(){
  achievements.forEach(a=>{
    if(!a.done && a.check()){ a.done=true; alert("🎉 実績解除: "+a.text); }
  });
}

// ====== ポップアップ収益 ======
function showPop(text,color,slotElem){
  const pop=document.createElement("div");
  pop.className="pop";
  pop.style.background=color;
  pop.textContent=text;
  slotElem.appendChild(pop);
  setTimeout(()=>pop.remove(),1000);
}

// ====== レベルアップ ======
function checkLevel(){
  const newLevel=Math.floor(totalEarned/20000)+1;
  if(newLevel>level){
    level=newLevel;
    alert(`⚡ レベルアップ! レベル${level}`);
  }
}

// ====== メインループ ======
setInterval(()=>{
  parks.forEach((park,pi)=>{
    // 入庫
    if(park.cars.length<park.slots && Math.random()<getDemand(park)){
      park.cars.push(createCar());
    }
    // 滞在減少
    park.cars.forEach(c=>c.stay--);
    // 出庫
    const leaving=park.cars.filter(c=>c.stay<=0);
    park.cars=park.cars.filter(c=>c.stay>0);
    leaving.forEach((c,ci)=>{
      const earning=park.price*c.rate;
      money+=earning;
      totalEarned+=earning;
    });
  });
  adBoost*=0.9;
  checkLevel();
  update();
},1000);

// ====== セーブ/ロード ======
function save(){
  const data={money,adBoost,parks,totalEarned,level,time:Date.now()};
  localStorage.setItem("parkingGame2",JSON.stringify(data));
}
function load(){
  const raw=localStorage.getItem("parkingGame2");
  if(!raw) return;
  const data=JSON.parse(raw);
  money=data.money??1000;
  adBoost=data.adBoost??0;
  parks=data.parks??parks;
  totalEarned=data.totalEarned??0;
  level=data.level??1;
  if(data.time){
    const seconds=Math.min((Date.now()-data.time)/1000,3600*4);
    const potential=Math.floor(seconds*parks.reduce((a,b)=>a.slots+b.slots,0)*100*0.2);
    money+=potential;
    totalEarned+=potential;
    alert(`💰 放置報酬: ${Math.floor(potential)}円`);
  }
}
setInterval(save,5000);
window.addEventListener("beforeunload",save);
load();
update();
</script>

</body>
</html>
