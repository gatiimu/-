<!DOCTYPE html><html lang="ja">
<head>
<meta charset="UTF-8">
<title>強くてニューゲームクリック 神版</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"><style>
html { touch-action: manipulation; }

body {
  text-align: center;
  font-family: Impact, sans-serif;
  background: radial-gradient(circle, #0f2027, #000);
  color: white;
  margin: 10px;
}

h1 {
  font-size: 34px;
  text-shadow: 0 0 15px cyan;
}

#stats div {
  margin: 6px;
  font-size: 18px;
}

button {
  padding: 18px 35px;
  font-size: 20px;
  margin: 8px;
  border-radius: 15px;
  border: none;
  color: white;
  background: linear-gradient(45deg, #ff0000, #ff8800);
  box-shadow: 0 0 15px red;
}

button:active {
  transform: scale(0.95);
}

.effect {
  position: absolute;
  font-weight: bold;
  animation: float 0.8s forwards;
}

@keyframes float {
  from { transform: translateY(0); opacity:1;}
  to { transform: translateY(-80px); opacity:0;}
}

/* ガチャ演出 */
#gachaResult {
  font-size: 24px;
  margin: 15px;
  height: 30px;
  text-shadow: 0 0 10px gold;
}
</style></head><body><h1>強くてニューゲームクリック 神版</h1><div id="stats">
  <div>時間: <span id="time">10</span></div>
  <div>スコア: <span id="score">0</span></div>
  <div>最高: <span id="highScore">0</span></div>
  <div>クリック力: <span id="power">1</span></div>
  <div>コンボ: <span id="combo">0</span></div>
  <div>自動: <span id="auto">0</span>/秒</div>
</div><div id="gachaResult"></div><button id="clickBtn">クリック！</button><br>
<button onclick="startGame()">スタート</button>
<button onclick="buyAuto()">自動強化 (50)</button>
<button onclick="buyPower()">クリック強化 (100)</button>
<button onclick="gacha()">ガチャ (200)</button>
<button onclick="resetData()">リセット</button>

<script>
let score = 0;
let time = 10;
let combo = 0;
let clickPower = parseFloat(localStorage.getItem('power')) || 1;
let highScore = parseInt(localStorage.getItem('high')) || 0;
let auto = parseFloat(localStorage.getItem('auto')) || 0;

let timer, comboTimer, autoTimer;

const el = id => document.getElementById(id);

function update() {
  el("score").textContent = Math.floor(score);
  el("time").textContent = time;
  el("power").textContent = clickPower.toFixed(2);
  el("combo").textContent = combo;
  el("auto").textContent = auto.toFixed(1);
  el("highScore").textContent = highScore;
}

function clickAction(x = window.innerWidth/2, y = window.innerHeight/2) {
  let multi = 1 + combo * 0.1;

  let crit = Math.random() < 0.1;
  let gain = clickPower * multi;

  if (crit) gain *= 3;

  score += gain;
  combo++;

  showEffect((crit ? "💥" : "+") + gain.toFixed(1), x, y, crit);

  clearTimeout(comboTimer);
  comboTimer = setTimeout(() => combo = 0, 1000);

  update();
}

el("clickBtn").onclick = (e) => {
  clickAction(e.clientX, e.clientY);
};

function startGame() {
  score = 0;
  time = 10;
  combo = 0;

  clearInterval(timer);
  clearInterval(autoTimer);

  timer = setInterval(() => {
    time--;
    if (time <= 0) endGame();
    update();
  }, 1000);

  autoTimer = setInterval(() => {
    for (let i = 0; i < auto; i++) clickAction();
  }, 1000);

  update();
}

function endGame() {
  clearInterval(timer);
  clearInterval(autoTimer);

  if (score > highScore) {
    highScore = score;
    localStorage.setItem('high', highScore);
  }

  clickPower += score * 0.01;
  localStorage.setItem('power', clickPower);
  localStorage.setItem('auto', auto);

  alert("終了！スコア: " + Math.floor(score));
}

function buyAuto() {
  if (score >= 50) {
    score -= 50;
    auto += 1;
    update();
  }
}

function buyPower() {
  if (score >= 100) {
    score -= 100;
    clickPower += 0.5;
    update();
  }
}

/* 🎰 ガチャ */
function gacha() {
  if (score < 200) {
    el("gachaResult").textContent = "スコア不足！";
    return;
  }

  score -= 200;

  let r = Math.random();
  let result = "";

  if (r < 0.5) {
    clickPower += 1;
    result = "ノーマル！ +1";
  } else if (r < 0.8) {
    clickPower += 3;
    result = "レア！ +3";
  } else if (r < 0.95) {
    clickPower += 7;
    result = "激レア！ +7";
  } else {
    clickPower += 20;
    result = "神！！ +20";
  }

  el("gachaResult").textContent = result;
  update();
}

/* エフェクト */
function showEffect(text, x, y, crit=false) {
  const e = document.createElement("div");
  e.className = "effect";
  e.textContent = text;

  e.style.left = x + "px";
  e.style.top = y + "px";
  e.style.color = crit ? "red" : "yellow";
  e.style.fontSize = crit ? "28px" : "20px";

  document.body.appendChild(e);
  setTimeout(() => e.remove(), 800);
}

function resetData() {
  localStorage.clear();
  location.reload();
}

update();
</script></body>
</html>
